<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background with Grid -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Subtle glow circles in background -->
  <circle cx="240" cy="315" r="280" fill="#10b981" fill-opacity="0.08" filter="url(#glow)"/>
  <circle cx="950" cy="315" r="240" fill="#06b6d4" fill-opacity="0.06" filter="url(#glow)"/>

  <!-- Left Side: Large Stylized CPU Chip -->
  <g transform="translate(100, 155)">
    <!-- Outer Glow -->
    <rect x="0" y="0" width="320" height="320" rx="40" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="4"/>
    <!-- Chip Base -->
    <rect x="16" y="16" width="288" height="288" rx="32" fill="url(#chipGrad)" stroke="#10b981" stroke-width="3"/>
    
    <!-- Centered Lucide CPU Vector -->
    <g transform="translate(48, 48) scale(9.33)" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20v2"/>
      <path d="M12 2v2"/>
      <path d="M17 20v2"/>
      <path d="M17 2v2"/>
      <path d="M2 12h2"/>
      <path d="M2 17h2"/>
      <path d="M2 7h2"/>
      <path d="M20 12h2"/>
      <path d="M20 17h2"/>
      <path d="M20 7h2"/>
      <path d="M7 20v2"/>
      <path d="M7 2v2"/>
      <rect x="4" y="4" width="16" height="16" rx="2" fill="#064e3b" fill-opacity="0.6"/>
      <rect x="8" y="8" width="8" height="8" rx="1" fill="#10b981" fill-opacity="0.35"/>
    </g>
  </g>

  <!-- Right Side: Content & Typography -->
  <g transform="translate(480, 160)">
    <!-- Category Pill -->
    <g transform="translate(0, 0)">
      <rect width="180" height="34" rx="17" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.5"/>
      <text x="90" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="1">INTEL 8085 STUDIO</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#f4f4f5" letter-spacing="-1">
      Intel 8085 Studio
    </text>
    <text x="0" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="url(#textGrad)">
      Cycle-Accurate Microprocessor IDE
    </text>

    <!-- Description -->
    <text x="0" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="19" fill="#a1a1aa" font-weight="400">
      Two-pass assembler, real-time animated data bus, 64KB memory inspector,
    </text>
    <text x="0" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="19" fill="#a1a1aa" font-weight="400">
      hardware interrupt pins, SIM/RIM decoder, and 10 undocumented ghost opcodes.
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 280)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="32" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
        <text x="65" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e4e4e7" text-anchor="middle">⚡ 256 Opcodes</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(142, 0)">
        <rect width="165" height="32" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
        <text x="82" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e4e4e7" text-anchor="middle">🔬 Silicon Accuracy</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(319, 0)">
        <rect width="160" height="32" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
        <text x="80" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e4e4e7" text-anchor="middle">🎨 Presenter Mode</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(491, 0)">
        <rect width="135" height="32" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
        <text x="67" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e4e4e7" text-anchor="middle">💾 64KB Linear</text>
      </g>
    </g>
  </g>
</svg>
